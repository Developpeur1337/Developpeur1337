<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="196" viewBox="0 0 1160 196" fill="none" role="img" aria-label="Stack technique">
  <title>Stack</title>
  <defs>
    <linearGradient id="sTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22D3EE" stop-opacity=".95"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sCard" x1="0" y1="0" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C0F1B"/><stop offset="1" stop-color="#080A12"/>
    </linearGradient>
    <clipPath id="sc1"><rect x="0" y="0" width="272" height="4" rx="2"/></clipPath>
    <clipPath id="sc2"><rect x="0" y="0" width="272" height="4" rx="2"/></clipPath>
    <clipPath id="sc3"><rect x="0" y="0" width="272" height="4" rx="2"/></clipPath>
    <clipPath id="sc4"><rect x="0" y="0" width="272" height="4" rx="2"/></clipPath>
  </defs>
  <style>
    .ss{font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
    .sm{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
    .beam{animation:beam 6s ease-in-out infinite}
    .b2{animation-delay:.5s}.b3{animation-delay:1s}.b4{animation-delay:1.5s}
    @keyframes beam{0%{transform:translateX(-140px);opacity:0}20%,70%{opacity:1}100%{transform:translateX(280px);opacity:0}}
    .ic{animation:ic 6s ease-in-out infinite}
    .i2{animation-delay:.5s}.i3{animation-delay:1s}.i4{animation-delay:1.5s}
    @keyframes ic{0%,100%{opacity:.7}30%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.beam,.ic{animation:none}.beam{opacity:0}}
  </style>

  <g>
    <rect x="0" y="0" width="272" height="196" rx="14" fill="url(#sCard)" stroke="#1A2133"/>
    <g clip-path="url(#sc1)"><rect class="beam" x="0" y="0" width="120" height="3" fill="url(#sTop)"/></g>
    <g class="ic" transform="translate(28,28)">
      <rect x="0" y="0" width="24" height="24" rx="6" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
      <text class="sm" x="12" y="17" font-size="11" fill="#A78BFA" text-anchor="middle" letter-spacing=".5">JS</text>
    </g>
    <text class="ss" x="28" y="96" fill="#EDF1F7" font-size="16" font-weight="700">JavaScript</text>
    <text class="ss" x="28" y="122" fill="#7D8899" font-size="12.5">ES2022+, async/await et</text>
    <text class="ss" x="28" y="140" fill="#7D8899" font-size="12.5">gestion fine de l'event loop</text>
    <text class="ss" x="28" y="158" fill="#7D8899" font-size="12.5">sur des traitements longs.</text>
    <text class="sm" x="244" y="40" fill="#2E3A55" font-size="11" text-anchor="end">01</text>
  </g>

  <g transform="translate(296,0)">
    <rect x="0" y="0" width="272" height="196" rx="14" fill="url(#sCard)" stroke="#1A2133"/>
    <g clip-path="url(#sc2)"><rect class="beam b2" x="0" y="0" width="120" height="3" fill="url(#sTop)"/></g>
    <g class="ic i2" transform="translate(28,28)" stroke="#7DA6F5" stroke-width="1.5" fill="none" stroke-linejoin="round">
      <path d="M12 1 22.4 7v12L12 25 1.6 19V7L12 1Z"/><path d="M8.5 16V9l7 8V9"/>
    </g>
    <text class="ss" x="28" y="96" fill="#EDF1F7" font-size="16" font-weight="700">Node.js</text>
    <text class="ss" x="28" y="122" fill="#7D8899" font-size="12.5">Runtime principal : process</text>
    <text class="ss" x="28" y="140" fill="#7D8899" font-size="12.5">longue durée, scripts et</text>
    <text class="ss" x="28" y="158" fill="#7D8899" font-size="12.5">outillage en ligne de commande.</text>
    <text class="sm" x="244" y="40" fill="#2E3A55" font-size="11" text-anchor="end">02</text>
  </g>

  <g transform="translate(592,0)">
    <rect x="0" y="0" width="272" height="196" rx="14" fill="url(#sCard)" stroke="#1A2133"/>
    <g clip-path="url(#sc3)"><rect class="beam b3" x="0" y="0" width="120" height="3" fill="url(#sTop)"/></g>
    <g class="ic i3" transform="translate(28,28)" stroke="#5EC8E0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 4h20v13H9l-6 5V4Z"/><path d="M7 9.5h9M7 13h6"/>
    </g>
    <text class="ss" x="28" y="96" fill="#EDF1F7" font-size="16" font-weight="700">discord.js</text>
    <text class="ss" x="28" y="122" fill="#7D8899" font-size="12.5">Bots full slash commands,</text>
    <text class="ss" x="28" y="140" fill="#7D8899" font-size="12.5">interactions, composants et</text>
    <text class="ss" x="28" y="158" fill="#7D8899" font-size="12.5">permissions granulaires.</text>
    <text class="sm" x="244" y="40" fill="#2E3A55" font-size="11" text-anchor="end">03</text>
  </g>

  <g transform="translate(888,0)">
    <rect x="0" y="0" width="272" height="196" rx="14" fill="url(#sCard)" stroke="#1A2133"/>
    <g clip-path="url(#sc4)"><rect class="beam b4" x="0" y="0" width="120" height="3" fill="url(#sTop)"/></g>
    <g class="ic i4" transform="translate(28,28)" stroke="#22D3EE" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="5" r="3"/><circle cx="5" cy="20" r="3"/><circle cx="19" cy="9" r="3"/>
      <path d="M5 8v9M5 14h8a6 6 0 0 0 6-2"/>
    </g>
    <text class="ss" x="28" y="96" fill="#EDF1F7" font-size="16" font-weight="700">Git</text>
    <text class="ss" x="28" y="122" fill="#7D8899" font-size="12.5">Commits atomiques, historique</text>
    <text class="ss" x="28" y="140" fill="#7D8899" font-size="12.5">lisible et dépôts publics</text>
    <text class="ss" x="28" y="158" fill="#7D8899" font-size="12.5">maintenus dans la durée.</text>
    <text class="sm" x="244" y="40" fill="#2E3A55" font-size="11" text-anchor="end">04</text>
  </g>
</svg>
