    <mask id="typeA">
      <rect x="212" y="288" height="40" width="0" fill="#fff">
        <animate attributeName="width"
                 values="0;0;344;344;0;0"
                 keyTimes="0;0.040;0.180;0.918;0.934;1"
                 dur="13s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <!-- line 3: user@dev1337:~$ cat stack.txt (29 ch x 15.6 = 453) -->
    <mask id="typeB">
      <rect x="212" y="404" height="40" width="0" fill="#fff">
