<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Développeur1337">
  <title>Développeur1337</title>
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06070D"/><stop offset=".5" stop-color="#0A0D18"/><stop offset="1" stop-color="#06070D"/>
    </linearGradient>
    <linearGradient id="pWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/><stop offset=".55" stop-color="#60A5FA"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="pRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".9"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pGlowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".5"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".3"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#2A3550" stroke-width="1" fill="none" stroke-opacity=".32"/>
    </pattern>
    <linearGradient id="pFade" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="pGridMask"><rect width="1200" height="300" fill="url(#pFade)"/></mask>
    <linearGradient id="pRailFade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".82" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="pRailMask"><rect y="30" width="1200" height="60" fill="url(#pRailFade)"/></mask>
    <clipPath id="pClip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .pm{font-family:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace}
    .ps{font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .rail{animation:rail 26s linear infinite}
    @keyframes rail{0%{transform:translateX(0)}100%{transform:translateX(-720px)}}
    .leet{animation:leet 7s step-end infinite}
    @keyframes leet{0%,4%{opacity:1}5%,8%{opacity:0}9%,12%{opacity:1}13%,100%{opacity:0}}
    .real{animation:real 7s step-end infinite}
    @keyframes real{0%,4%{opacity:0}5%,8%{opacity:1}9%,12%{opacity:0}13%,100%{opacity:1}}
    .cursor{animation:cur 1s step-end infinite}
    @keyframes cur{0%,50%{opacity:1}51%,100%{opacity:0}}
    .rule{transform-origin:0 0;animation:rule 7s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes rule{0%,13%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}
    .eyebrow{animation:eb 7s ease-in-out infinite}
    @keyframes eb{0%{opacity:0}14%{opacity:1}90%{opacity:1}100%{opacity:.4}}
    .chip{animation:chip 7s ease-out infinite}
    @keyframes chip{0%,22%{opacity:0;transform:translateY(6px)}44%,100%{opacity:1;transform:translateY(0)}}
    .c2{animation-delay:.12s}.c3{animation-delay:.24s}
    .orbA{animation:oa 15s ease-in-out infinite}
    .orbB{animation:ob 19s ease-in-out infinite}
    @keyframes oa{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-14px)}}
    @keyframes ob{0%,100%{transform:translate(0,0)}50%{transform:translate(-48px,12px)}}
    @media (prefers-reduced-motion:reduce){
      .rail,.leet,.real,.cursor,.rule,.eyebrow,.chip,.orbA,.orbB{animation:none}
      .leet{opacity:0}.real{opacity:1}.rule{transform:none}
    }
  </style>

  <g clip-path="url(#pClip)">
    <rect width="1200" height="300" fill="url(#pBg)"/>
    <rect width="1200" height="300" fill="url(#pGrid)" mask="url(#pGridMask)"/>
    <g class="orbA"><ellipse cx="230" cy="60" rx="320" ry="190" fill="url(#pGlowA)"/></g>
    <g class="orbB"><ellipse cx="1010" cy="250" rx="300" ry="180" fill="url(#pGlowB)"/></g>

    <!-- rail de données : le flux qui tourne en arrière-plan -->
    <g mask="url(#pRailMask)">
      <g class="rail">
        <text class="pm" x="0" y="66" font-size="13" letter-spacing="3.6" fill="#26314C">async 0x1337 await 4A7F node ES2022 promise 0b1010 event-loop 0x1337 async 4A7F await node ES2022 promise 0b1010 event-loop</text>
        <text class="pm" x="720" y="66" font-size="13" letter-spacing="3.6" fill="#26314C">async 0x1337 await 4A7F node ES2022 promise 0b1010 event-loop 0x1337 async 4A7F await node ES2022 promise 0b1010 event-loop</text>
      </g>
    </g>
    <line x1="0" y1="92" x2="1200" y2="92" stroke="#1A2133"/>

    <g transform="translate(72,0)">
      <text class="pm eyebrow" x="0" y="140" fill="#22D3EE" font-size="12.5" letter-spacing="5.2">JAVASCRIPT · NODE.JS · DISCORD.JS</text>
      <g font-size="64" font-weight="800" letter-spacing="1.2">
        <text class="ps leet" x="-2" y="200" fill="#3F4A66">D3V3L0PP3UR1337</text>
        <text class="ps real" x="-2" y="200">
          <tspan fill="#F0F4FA">DÉVELOPPEUR</tspan><tspan fill="url(#pWord)">1337</tspan>
        </text>
      </g>
      <rect class="cursor" x="612" y="172" width="14" height="34" fill="#22D3EE" opacity=".75"/>
      <rect class="rule" x="0" y="222" width="470" height="2" fill="url(#pRule)"/>
      <text class="ps" x="0" y="254" fill="#8A94A6" font-size="15">Développeur JavaScript. Bots Discord full slash commands et outils Node.js.</text>
    </g>

    <g class="pm" font-size="11" letter-spacing="2.4" transform="translate(890,140)">
      <g class="chip"><rect x="0" y="0" width="220" height="28" rx="8" fill="#0F1422" stroke="#26304A"/><text x="16" y="18" fill="#A78BFA">JAVASCRIPT</text><text x="204" y="18" fill="#4E5A6E" text-anchor="end">ES2022</text></g>
      <g class="chip c2"><rect x="0" y="38" width="220" height="28" rx="8" fill="#0F1422" stroke="#26304A"/><text x="16" y="56" fill="#60A5FA">NODE.JS</text><text x="204" y="56" fill="#4E5A6E" text-anchor="end">RUNTIME</text></g>
      <g class="chip c3"><rect x="0" y="76" width="220" height="28" rx="8" fill="#0F1422" stroke="#26304A"/><text x="16" y="94" fill="#22D3EE">DISCORD.JS</text><text x="204" y="94" fill="#4E5A6E" text-anchor="end">SLASH</text></g>
    </g>

    <g stroke="#2A3550" stroke-width="1.2" fill="none" opacity=".9">
      <path d="M22 44 V22 H44"/><path d="M1178 44 V22 H1156"/>
      <path d="M22 256 V278 H44"/><path d="M1178 256 V278 H1156"/>
    </g>
    <rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#1A2133"/>
  </g>
</svg>
