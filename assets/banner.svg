<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-label="Developpeur1337 - Developpeur backend. Building things with Node.js.">
  <title>Développeur1337 — Developer</title>

  <defs>
